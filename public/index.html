<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #4f46e5; --accent-soft: #eef2ff; --user: #1c1917; --user-text: #fafaf9;
    --code: #f5f5f4; --err: #b91c1c; --err-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --line: #292524;
      --accent: #818cf8; --accent-soft: #1e1b4b; --user: #e7e5e4; --user-text: #1c1917;
      --code: #292524; --err: #fca5a5; --err-bg: #450a0a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
  .logo { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
  .logo::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  button { font: inherit; cursor: pointer; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--text); padding: 6px 12px; border-radius: 8px; }
  .ghost:hover { background: var(--code); }
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  #thread { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; display: flex; flex-direction: column; gap: 22px; }
  .msg.user { align-self: flex-end; max-width: 85%; background: var(--user); color: var(--user-text); padding: 9px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; word-break: break-word; }
  .msg.assistant { max-width: 100%; }
  .msg .time { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg.user .time { color: inherit; opacity: .55; text-align: right; }
  .body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
  .body p { margin: .6em 0; } .body ul, .body ol { margin: .6em 0; padding-left: 1.4em; }
  .body h3, .body h4, .body h5 { margin: 1em 0 .3em; line-height: 1.3; }
  .body code { background: var(--code); padding: .1em .35em; border-radius: 5px; font-size: .9em; }
  .body pre { background: var(--code); padding: 12px; border-radius: 10px; overflow-x: auto; } .body pre code { padding: 0; background: none; }
  .body blockquote { margin: .6em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .body a { color: var(--accent); }
  .table-wrap { overflow-x: auto; margin: .7em 0; }
  table { border-collapse: collapse; font-size: 14px; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--code); font-weight: 600; }
  .cite { display: inline-block; min-width: 1.5em; text-align: center; font-size: .72em; font-weight: 600; line-height: 1.5; padding: 0 .35em; margin: 0 .1em; border-radius: 6px; background: var(--accent-soft); color: var(--accent) !important; text-decoration: none; vertical-align: .15em; }
  a.cite:hover { filter: brightness(.95); }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; padding: 3px 10px 3px 4px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); text-decoration: none; background: var(--panel); }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip b { background: var(--accent-soft); color: var(--accent); border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; font-size: 11px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-height: 22px; }
  .dots { display: inline-flex; gap: 3px; } .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  .error { background: var(--err-bg); color: var(--err); padding: 10px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px; }
  .error button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 4px 12px; }
  .empty { text-align: center; padding: 12vh 0 0; } .empty h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 6px; } .empty p { color: var(--muted); margin: 0 0 22px; }
  .suggest { display: grid; gap: 8px; max-width: 520px; margin: 0 auto; }
  .suggest button { text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px 14px; border-radius: 12px; }
  .suggest button:hover { border-color: var(--accent); }
  footer { padding: 8px 16px 18px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; }
  form:focus-within { border-color: var(--accent); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: inherit; font: inherit; max-height: 160px; padding: 6px 0; }
  .send { background: var(--accent); color: #fff; border: 0; border-radius: 10px; height: 36px; padding: 0 16px; font-weight: 600; }
  .send:disabled { opacity: .4; cursor: not-allowed; } .send.stop { background: var(--user); color: var(--user-text); }
  .hint { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>Minimi</div>
  <button class="ghost" id="new">New chat</button>
</header>
<main id="scroller"><div id="thread"></div></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask anything. I search the web and remember our past chats." autofocus></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter to send · Shift+Enter for a new line</div>
</footer>

<script type="module">
import { renderMarkdown } from "/markdown.js";

const $ = (id) => document.getElementById(id);
const thread = $("thread"), scroller = $("scroller"), input = $("input"), sendBtn = $("send");
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let sessionId = store.get("minimi.session") || crypto.randomUUID();
store.set("minimi.session", sessionId);
let controller = null;
let lastMessage = "";

const SUGGESTIONS = [
  "On Monday we shortlisted 5 CRM tools for a 20-person sales team. Has any of them changed pricing since?",
  "What did I ask you on 3 November? Is your answer still correct today?",
  "What's new in Postgres hosting pricing this month?",
];

const fmtTime = (iso) => new Date(iso).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

function addUser(text, iso) {
  const m = el("div", "msg user");
  m.textContent = text;
  if (iso) m.append(el("span", "time", fmtTime(iso)));
  thread.append(m);
  return m;
}

function sourcesBar(items) {
  const bar = el("div", "sources");
  for (const s of items) {
    const a = el("a", "chip");
    a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.title = s.title;
    a.append(el("b", "", String(s.id)), el("span", "", hostOf(s.url)));
    bar.append(a);
  }
  return bar;
}

function addAssistant(text = "", sources = [], iso) {
  const m = el("div", "msg assistant");
  const body = el("div", "body", renderMarkdown(text, sources));
  m.append(body);
  if (sources.length) m.append(sourcesBar(sources));
  if (iso) m.append(el("span", "time", fmtTime(iso)));
  thread.append(m);
  return { m, body };
}

function showEmpty() {
  const box = el("div", "empty");
  box.append(el("h1", "", "What do you want to know?"), el("p", "", "Live web search, with a memory of everything we've discussed."));
  const list = el("div", "suggest");
  for (const s of SUGGESTIONS) {
    const b = el("button"); b.type = "button"; b.textContent = s;
    b.onclick = () => { input.value = s; send(); };
    list.append(b);
  }
  box.append(list);
  thread.append(box);
}

async function loadHistory() {
  try {
    const res = await fetch(`/api/history?sessionId=${encodeURIComponent(sessionId)}`);
    const { messages = [] } = await res.json();
    thread.replaceChildren();
    if (!messages.length) return showEmpty();
    for (const m of messages) m.role === "user" ? addUser(m.content, m.timestamp) : addAssistant(m.content, m.sources, m.timestamp);
    toBottom();
  } catch { thread.replaceChildren(); showEmpty(); }
}

function setBusy(busy) {
  input.disabled = busy;
  sendBtn.textContent = busy ? "Stop" : "Send";
  sendBtn.classList.toggle("stop", busy);
  if (!busy) input.focus();
}

async function* sseEvents(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
      const data = block.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trimStart()).join("\n");
      if (data) yield JSON.parse(data);
    }
  }
}

async function send(retry = false) {
  if (controller) { controller.abort(); return; } // button doubles as Stop
  const text = retry ? lastMessage : input.value.trim();
  if (!text) return;
  lastMessage = text;
  if (!retry) {
    thread.querySelector(".empty")?.remove();
    addUser(text, new Date().toISOString());
    input.value = ""; input.style.height = "auto";
  }
  thread.querySelectorAll(".error").forEach((e) => e.remove());

  const { m, body } = addAssistant();
  const status = el("div", "status", `<span class="dots"><i></i><i></i><i></i></span><span>Thinking</span>`);
  m.prepend(status);
  toBottom();

  controller = new AbortController();
  setBusy(true);
  let raw = "", sources = [], frame = 0, failed = false;
  const paint = () => { frame = 0; const stick = nearBottom(); body.innerHTML = renderMarkdown(raw, sources); if (stick) toBottom(); };

  try {
    const res = await fetch("/api/chat", {
      method: "POST", signal: controller.signal,
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sessionId, message: text, tz }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Request failed (${res.status})`);
    for await (const ev of sseEvents(res)) {
      if (ev.type === "status") status.lastElementChild.textContent = ev.text;
      else if (ev.type === "token") { if (status.isConnected) status.remove(); raw += ev.text; if (!frame) frame = requestAnimationFrame(paint); }
      else if (ev.type === "reset") { raw = ""; body.innerHTML = ""; }
      else if (ev.type === "sources") { sources = ev.items; }
      else if (ev.type === "error") { failed = true; throw new Error(ev.message); }
    }
    cancelAnimationFrame(frame); paint();
    if (sources.length) m.append(sourcesBar(sources));
    m.append(el("span", "time", fmtTime(new Date().toISOString())));
  } catch (err) {
    cancelAnimationFrame(frame);
    status.remove();
    if (err.name === "AbortError") {
      paint();
      m.append(el("span", "time", "Stopped. This turn was not saved."));
    } else {
      if (!raw) m.remove(); else paint();
      const box = el("div", "error");
      box.append(el("span", "", err.message || "Something went wrong."));
      const b = el("button", "", "Retry"); b.type = "button"; b.onclick = () => send(true);
      box.append(b);
      thread.append(box);
    }
  } finally {
    controller = null;
    setBusy(false);
    toBottom();
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
$("new").addEventListener("click", () => {
  if (controller) controller.abort();
  sessionId = crypto.randomUUID(); store.set("minimi.session", sessionId);
  thread.replaceChildren(); showEmpty(); input.focus();
});

loadHistory();
</script>
</body>
</html>
